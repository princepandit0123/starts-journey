<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>STARTS JOURNEY CMS</title><style>body{font-family:Arial;margin:0;background:#f5f5f5;color:#111}.wrap{max-width:1100px;margin:auto;padding:24px}.box{background:#fff;padding:20px;margin:16px 0;border:1px solid #ddd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input,textarea,select{width:100%;padding:11px;margin:7px 0;box-sizing:border-box;border:1px solid #ccc}button{padding:11px 16px;background:#d71920;color:#fff;border:0;font-weight:700;cursor:pointer}.item{padding:12px;border-bottom:1px solid #ddd}.muted{color:#666;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>STARTS JOURNEY — Admin CMS</h1><p class="muted">Update news, ticker and community posts. Changes are saved in the server database.</p><div class="box"><h2>Sync Latest News</h2><button onclick="sync()">SYNC NOW</button> <span id="syncmsg"></span></div><div class="box"><h2>Add News</h2><div class="grid"><input id="title" placeholder="Headline"><input id="cat" placeholder="Category"><input id="image" placeholder="Image URL"><input id="source" placeholder="Source name"><input id="url" placeholder="Source URL"></div><textarea id="desc" rows="4" placeholder="Description"></textarea><button onclick="add()">PUBLISH NEWS</button></div><div class="box"><h2>Breaking Ticker</h2><input id="ticker"><button onclick="ticker()">UPDATE TICKER</button></div><div class="box"><h2>Pending User Posts</h2><div id="posts"></div></div><div class="box"><h2>Published News</h2><div id="articles"></div></div></div><script>let ADMIN_KEY=sessionStorage.getItem('sj_admin_key')||'';function askKey(){ADMIN_KEY=prompt('Enter admin key to make changes:')||'';sessionStorage.setItem('sj_admin_key',ADMIN_KEY)}if(!ADMIN_KEY)askKey();async function api(u,o){o=o||{};o.headers=Object.assign({'x-admin-key':ADMIN_KEY},o.headers||{});let r=await fetch(u,o);if(r.status===401){alert('Admin key missing or incorrect.');askKey();throw new Error('unauthorized')}return r.json()}async function load(){let d=await api('/api/content');document.getElementById('ticker').value=d.ticker;document.getElementById('posts').innerHTML=d.posts.filter(p=>p.status==='pending').map(p=>`<div class=item><b>${esc(p.title)}</b><div>${esc(p.body)}</div><small>By ${esc(p.name)}</small><br><button onclick="approve('${p.id}')">APPROVE</button> <button onclick="reject('${p.id}')">REJECT</button></div>`).join('')||'<p>No pending posts.</p>';document.getElementById('articles').innerHTML=d.articles.slice(0,30).map(a=>`<div class=item><b>${esc(a.title)}</b><div class=muted>${esc(a.category)} · ${esc(a.source)}</div><button onclick="del('${a.id}')">DELETE</button></div>`).join('')||'<p>No articles yet.</p>'}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function add(){await api('/api/articles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,category:cat.value,image:image.value,source:source.value,sourceUrl:url.value,description:desc.value})});title.value=cat.value=image.value=source.value=url.value=desc.value='';load()}async function sync(){syncmsg.textContent='Syncing...';let r=await api('/api/sync-news',{method:'POST'});syncmsg.textContent=r.ok?` Added ${r.count} stories.`:' '+r.error;load()}async function ticker(){await api('/api/ticker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker:ticker.value})});alert('Ticker updated')}async function approve(id){await api('/api/posts/'+id+'/approve',{method:'POST'});load()}async function reject(id){await api('/api/posts/'+id+'/reject',{method:'POST'});load()}async function del(id){await api('/api/articles/'+id,{method:'DELETE'});load()}load()</script></body></html>
